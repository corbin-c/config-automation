# Foot settings based on the previous workstation config.
shell=/bin/zsh
term=foot
font=Fira Code:size=9
resize-delay-ms=50
pad=8x6

[scrollback]
lines=10000

[url]
launch=xdg-open ${url}
label-letters=sadfjklewcmpgh
osc8-underline=url-mode

[colors-dark]
alpha=0.95
foreground=cdd6f4
background=1e1e2e
regular0=45475a
regular1=f38ba8
regular2=a6e3a1
regular3=f9e2af
regular4=89b4fa
regular5=f5c2e7
regular6=94e2d5
regular7=bac2de
bright0=585b70
bright1=f38ba8
bright2=a6e3a1
bright3=f9e2af
bright4=89b4fa
bright5=f5c2e7
bright6=94e2d5
bright7=a6adc8
selection-foreground=1e1e2e
selection-background=f5e0dc
urls=89b4fa
